<!DOCTYPE html>
<html>
<head>
    <title>Add Company</title>
</head>
<body>

    <h2>Add Company</h2>

    <form method="POST">

        <label>Company Name:</label><br>
        <input type="text" name="company_name" required><br><br>

        <label>Role:</label><br>
        <input type="text" name="role" required><br><br>

        <label>Package (LPA):</label><br>
        <input type="number" step="0.1" name="package_lpa" required><br><br>

        <label>Drive Date:</label><br>
        <input type="date" name="drive_date" required><br><br>

        <label>Status:</label><br>
        <select name="status">
            <option>Applied</option>
            <option>Test Cleared</option>
            <option>Interview Scheduled</option>
            <option>Selected</option>
            <option>Rejected</option>
        </select><br><br>

        <button type="submit">Save Company</button>

    </form>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
